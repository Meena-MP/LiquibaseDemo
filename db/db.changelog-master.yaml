databaseChangeLog:
  - changeSet:
      id: 001
      author: student
      changes:
        - createTable:
            tableName: student
            columns:
              - column:
                  name: id
                  type: INT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: student

  - changeSet:
      id: 002
      author: student
      changes:
        - addColumn:
            tableName: student
            columns:
              - column:
                  name: email
                  type: VARCHAR(100)
      rollback:
        - dropColumn:
            tableName: student
            columnName: email